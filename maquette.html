<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Maquette 3D · Chantier maison</title>
  <meta name="theme-color" content="#0a1520">
  <meta name="robots" content="noindex">
  <link rel="icon" href="icones/icone-192.png">
  <style>
    :root { --fond: #0e1b28; --surface: rgb(20 34 48 / .86); --encre: #eef2f5; --doux: #9fb0bf; --jaune: #f2b705; --trait: rgb(255 255 255 / .14); }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--fond); color: var(--encre); font: 15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overscroll-behavior: none; }
    canvas { display: block; touch-action: none; }
    .barre { position: fixed; top: 0; left: 0; right: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 10px max(12px, env(safe-area-inset-left)); background: var(--surface); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--trait); z-index: 5; }
    .retour { color: var(--encre); text-decoration: none; font-weight: 700; font-size: 15px; padding: 6px 10px 6px 4px; border-radius: 999px; }
    .retour:active { background: rgb(255 255 255 / .08); }
    .groupe { display: flex; background: rgb(255 255 255 / .06); border: 1px solid var(--trait); border-radius: 999px; padding: 2px; }
    .groupe button { font: inherit; font-size: 14px; font-weight: 600; color: var(--doux); background: none; border: 0; border-radius: 999px; padding: 6px 12px; cursor: pointer; transition: background .15s, color .15s, transform .1s; }
    .groupe button[aria-pressed="true"] { background: var(--jaune); color: #1e2429; }
    .groupe button:active { transform: scale(.95); }
    .reglage { display: none; align-items: center; gap: 8px; font-size: 13px; color: var(--doux); }
    .visite .reglage { display: flex; }
    .reglage input { width: 110px; accent-color: var(--jaune); }
    .piece { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom)); padding: 6px 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--trait); font-weight: 600; pointer-events: none; z-index: 4; transition: opacity .2s; }
    .aide { position: fixed; right: 12px; bottom: calc(24px + env(safe-area-inset-bottom)); max-width: 280px; padding: 8px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--trait); font-size: 12px; color: var(--doux); z-index: 4; }
    .joystick { position: fixed; left: 24px; bottom: calc(70px + env(safe-area-inset-bottom)); width: 120px; height: 120px; border-radius: 50%; background: rgb(255 255 255 / .08); border: 1px solid var(--trait); display: none; z-index: 4; touch-action: none; }
    .joystick i { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgb(242 183 5 / .85); transition: transform .08s; }
    .visite.tactile .joystick { display: block; }
    .etiquettes { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
    .etiquettes span { position: absolute; transform: translate(-50%, -50%); font-size: 12px; font-weight: 700; color: #1e2429; background: rgb(255 255 255 / .82); padding: 2px 7px; border-radius: 6px; white-space: nowrap; }
    .etiquettes span.cote { font-size: 10.5px; font-weight: 600; color: #0d4f9c; background: rgb(232 242 255 / .9); padding: 1px 4px; border-radius: 4px; }
    .etiquettes span.ouverture { color: #8a4b00; background: rgb(255 240 220 / .92); }
    .visite .etiquettes span:not(.cote) { display: none; }
    .etat { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--doux); }
    .etat a { color: var(--jaune); }
    @media (max-width: 640px) { .aide { display: none; } }
    /* Barre de boutons sur une seule rangée qui défile du doigt (portrait comme paysage) :
       plus aucun bouton ne sort de l'écran. Fondu à droite tant qu'il reste des boutons à voir. */
    .barre { flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; touch-action: pan-x; overscroll-behavior-x: contain; }
    .barre::-webkit-scrollbar { display: none; }
    .barre > * { flex: none; }
    .barre .groupe button { white-space: nowrap; }
    .barre.suite { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 36px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 36px), transparent); }
  </style>
</head>
<body>
  <div class="barre">
    <a class="retour" href="./#bilan">‹ Chantier</a>
    <div class="groupe" role="group" aria-label="Mode">
      <button data-mode="ensemble" aria-pressed="true">Vue d'ensemble</button>
      <button data-mode="visite" aria-pressed="false">Visite</button>
    </div>
    <div class="groupe" role="group" aria-label="Phase">
      <button data-phase="avant" aria-pressed="false">Avant</button>
      <button data-phase="apres" aria-pressed="true">Après</button>
    </div>
    <div class="groupe" role="group" aria-label="Éclairage">
      <button id="lumiere" aria-pressed="true">💡 Lumière</button>
      <button id="cotes" aria-pressed="false">📏 Cotes</button>
      <button id="etage" aria-pressed="false">🪜 Étage</button>
      <button id="toit" aria-pressed="false">🏠 Toit</button>
      <button id="fenetres" aria-pressed="true">🪟 Fenêtres</button>
      <button id="voir-meubles" aria-pressed="true">🪑 Meubles</button>
      <button id="meubles" aria-pressed="false">✋ Déplacer</button>
    </div>
    <label class="reglage">Yeux <input type="range" id="yeux" min="140" max="195" value="170"><b id="yeux-val">1,70 m</b></label>
  </div>
  <div class="etiquettes" id="etiquettes"></div>
  <div class="joystick" id="joystick"><i></i></div>
  <div class="piece" id="piece" hidden></div>
  <div class="aide" id="aide">Glisser pour tourner, molette ou pincer pour zoomer. Visite : ZQSD ou flèches pour marcher, glisser pour regarder.</div>
  <p class="etat" id="etat">Chargement de la maquette…</p>

  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script type="module">
    // La maquette (plan de la maison) est privée : elle est lue dans Supabase,
    // seulement pour un compte du foyer connecté. Ce dépôt n'en contient rien.
    const etat = document.getElementById('etat');
    const cfg = window.CHANTIER_CONFIG || {};
    try {
      if (!cfg.supabaseUrl) throw new Error('Maquette disponible une fois l\'application reliée à Supabase.');
      const sb = supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { location.replace('./'); throw new Error('Connexion nécessaire.'); }
      const { data, error } = await sb.from('maquette').select('donnees').eq('id', 'rdc').maybeSingle();
      if (error) throw new Error(error.message);
      if (!data) throw new Error('Aucune maquette enregistrée pour le moment.');
      window.MAISON = data.donnees;
      // Correction du 27/11 (mesures de Yoann) : plafond du RDC à 247,5 cm, fenêtres du hall et
      // des chambres 1 et 2 avec le bas à 88 cm et le haut à 216 cm. Appliquée une seule fois,
      // puis enregistrée dans Supabase par le premier appareil connecté qui ouvre la maquette.
      {
        const d = data.donnees; let change = false;
        if (d.HAUTEUR === 250) {
          d.HAUTEUR = 247.5; change = true;
          if (d.etage?.niveau === 270) d.etage.niveau = 267.5;
          for (const o of d.objets || []) {
            if (o.h === 250) o.h = 247.5;
            if (o.h === 6 && o.z === 244) o.z = 241.5;
          }
        }
        const noms = ['Fenêtre hall', 'Fenêtre chambre 1', 'Fenêtre chambre 2'];
        for (const m of d.murs || []) for (const o of m.ouvertures || []) {
          if (noms.includes(o.nom) && o.allege !== 88) {
            o.allege = 88; o.haut = 216; change = true;
            o.note = 'Mesuré (Yoann, 27/11) : largeur 106,5 cm, bas à 88 cm du sol, haut à 31,5 cm sous le plafond (247,5 cm), donc 128 cm de haut.';
          }
        }
        // Ouvertures mesurées « à X cm sous le plafond » : leur haut descend de 2,5 cm.
        const hauts = { 'Fenêtre ouest cuisine': [219.5, 217], 'Fenêtre cuisine': [218, 215.5],
          'Fenêtre salle d\'eau': [219.5, 217], 'Porte-fenêtre en biais côté chambres': [217.2, 214.7],
          'Porte-fenêtre en biais côté garage': [216.5, 214], 'Porte-fenêtre double (jardin)': [219.5, 217] };
        for (const m of d.murs || []) for (const o of m.ouvertures || []) {
          const h = hauts[o.nom];
          if (h && o.haut === h[0]) { o.haut = h[1]; change = true; }
        }
        if (change) {
          const { error: e } = await sb.from('maquette').update({ donnees: d, updated_at: new Date().toISOString() }).eq('id', 'rdc');
          if (e) console.warn('Correction du 27/11 non enregistrée :', e.message);
        }
      }
      // Positions des meubles déplacés, partagées par le foyer (ligne « mobilier »).
      const { data: mobilier } = await sb.from('maquette').select('donnees').eq('id', 'mobilier').maybeSingle();
      window.MAISON_MOBILIER = mobilier?.donnees || null;
      // Enregistrement par différence : relit l'état du serveur et n'y change que les meubles
      // (et portes) modifiés ici, pour ne pas effacer ce qu'un autre appareil a fait.
      window.MAISON_FUSIONNER_MOBILIER = async diff => {
        const { data: actuel, error: e1 } = await sb.from('maquette').select('donnees').eq('id', 'mobilier').maybeSingle();
        if (e1) throw new Error(e1.message);
        const d = { ...(actuel?.donnees || {}), ...diff };
        if (diff._portes) d._portes = { ...(actuel?.donnees?._portes || {}), ...diff._portes };
        const { error: erreur } = await sb.from('maquette').upsert({ id: 'mobilier', donnees: d, updated_at: new Date().toISOString() });
        if (erreur) throw new Error(erreur.message);
      };
      window.MAISON_SAUVER_MOBILIER = async positions => {
        const { error: erreur } = await sb.from('maquette')
          .upsert({ id: 'mobilier', donnees: positions, updated_at: new Date().toISOString() });
        if (erreur) throw new Error(erreur.message);
      };
      // Objets 3D (fichiers .glb) : stockage privé « objets3d », lu avec la session du foyer.
      // Absent ou illisible → null, la maquette garde alors le meuble simplifié.
      // Prises et interrupteurs (bouton ⚡), partagés par le foyer (ligne « electricite »).
      const { data: electricite } = await sb.from('maquette').select('donnees').eq('id', 'electricite').maybeSingle();
      window.MAISON_ELEC = electricite?.donnees || null;
      window.MAISON_SAUVER_ELEC = async d => {
        const { error: erreur } = await sb.from('maquette')
          .upsert({ id: 'electricite', donnees: d, updated_at: new Date().toISOString() });
        if (erreur) throw new Error(erreur.message);
      };
      const objets3d = {};
      window.MAISON_OBJET3D = nom => objets3d[nom] ||= sb.storage.from('objets3d').download(`${nom}.glb`)
        .then(({ data }) => data ? URL.createObjectURL(data) : null, () => null);
      await import('./vue3d.js');
      etat.remove();
    } catch (e) {
      etat.innerHTML = `${e.message}<br><br><a href="./#bilan">Revenir au chantier</a>`;
    }
  </script>
</body>
</html>
